lor:#71717a;margin-top:4px;\">MILESTONES<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:9px 13px;min-width:60px;\">\n          <div style=\"font-size:18px;font-weight:600;line-height:1;\">9<\u002Fdiv>\n          <div style=\"font-family:'Geist Mono',monospace;font-size:8.5px;letter-spacing:.06em;color:#71717a;margin-top:4px;\">BADGES<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== MAIN: QUESTMAP + RAIL ===== -->\n    <div style=\"display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start;\">\n\n      <!-- LEFT COLUMN: questmap + skill tree -->\n      <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0;\">\n\n      <!-- ACTIVE QUESTLINE (hero) -->\n      <div style=\"position:relative;overflow:hidden;background:#131316;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px 20px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;\">\n          <div style=\"display:flex;align-items:center;gap:9px;\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.12em;color:#6366f1;\">ACTIVE QUESTLINE<\u002Fspan>\n            <span style=\"font-family:'Geist Mono',monospace;font-size:10.5px;color:#818cf8;background:rgba(99,102,241,.12);padding:2px 8px;border-radius:20px;\">58%<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px;\">\n            <span style=\"font-size:11px;font-weight:500;color:#c7d2fe;background:rgba(99,102,241,.16);border:1px solid rgba(129,140,248,.4);padding:3px 11px;border-radius:20px;\">Career<\u002Fspan>\n            <span style=\"font-size:11px;color:#a1a1aa;padding:3px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.09);\">Education<\u002Fspan>\n            <span style=\"font-size:11px;color:#a1a1aa;padding:3px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.09);\">Freelance<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;margin-bottom:22px;\">Backend Engineer Path<\u002Fdiv>\n\n        <!-- node map -->\n        <div style=\"display:flex;align-items:flex-start;gap:0;padding:0 2px;\">\n          <sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div class=\"dq-node\" style=\"flex:none;width:{{ s.colW }};display:flex;flex-direction:column;align-items:center;gap:9px;transition:transform .15s;cursor:pointer;\">\n              <div style=\"width:46px;height:46px;border-radius:13px;background:{{ s.bg }};border:{{ s.border }};display:flex;align-items:center;justify-content:center;font-size:17px;{{ s.glow }}{{ s.anim }}\">{{ s.icon }}<\u002Fdiv>\n              <div style=\"text-align:center;\">\n                <div style=\"font-size:11px;font-weight:500;color:{{ s.labelColor }};line-height:1.2;white-space:nowrap;\">{{ s.name }}<\u002Fdiv>\n                <div style=\"font-family:'Geist Mono',monospace;font-size:9.5px;color:{{ s.xpColor }};margin-top:2px;\">{{ s.xp }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;height:2px;margin-top:22px;background:{{ s.conn }};display:{{ s.connDisplay }};min-width:8px;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- active quest footer -->\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(99,102,241,.03));border:1px solid rgba(129,140,248,.3);\">\n          <div style=\"width:30px;height:30px;flex:none;border-radius:9px;background:rgba(129,140,248,.2);border:1px solid #818cf8;display:flex;align-items:center;justify-content:center;font-size:13px;\">▶<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:.1em;color:#818cf8;\">CURRENT OBJECTIVE<\u002Fdiv>\n            <div style=\"font-size:13.5px;font-weight:500;margin-top:2px;\">Design a rate limiter<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#c7d2fe;background:rgba(99,102,241,.16);padding:5px 11px;border-radius:8px;flex:none;\">+200 XP<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SKILL TREE (under questmap) -->\n      <div style=\"background:#131316;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px;\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;\">\n          <div>\n            <div style=\"font-family:'Geist Mono',monospace;font-size:10px;color:#6366f1;letter-spacing:.1em;margin-bottom:5px;\">SKILL TREE<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;\">32 of 54 skills unlocked<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'Geist Mono',monospace;font-size:11.5px;color:#818cf8;background:rgba(99,102,241,.12);padding:3px 9px;border-radius:20px;white-space:nowrap;flex:none;\">3 learning<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:stretch;gap:13px;\">\n          <sc-for list=\"{{ branches }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:0;\">\n              <div style=\"flex:none;width:48px;height:48px;border-radius:12px;background:{{ b.rootBg }};border:{{ b.rootBorder }};{{ b.rootGlow }}display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;\">\n                <span style=\"font-size:16px;\">{{ b.icon }}<\u002Fspan><span style=\"font-size:7.5px;color:#c7d2fe;font-family:'Geist Mono',monospace;\">{{ b.name }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:none;width:8px;height:2px;background:#3f3f46;\"><\u002Fdiv>\n              <div style=\"flex:none;width:2px;align-self:stretch;background:#3f3f46;margin:13px 0;\"><\u002Fdiv>\n              <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;\">\n                <sc-for list=\"{{ b.children }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;align-items:center;gap:0;\">\n                    <div style=\"flex:none;width:6px;height:2px;background:#3f3f46;\"><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:9px;background:{{ c.bg }};border:{{ c.border }};opacity:{{ c.opacity }};\">\n                      <span style=\"font-size:12px;\">{{ c.icon }}<\u002Fspan>\n                      <span style=\"font-size:11px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ c.name }}<\u002Fspan>\n                      <span style=\"{{ c.dotStyle }}\">{{ c.lock }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:15px;padding-top:13px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:16px;font-size:10px;font-family:'Geist Mono',monospace;\">\n          <span style=\"color:#71717a;\">MASTERY<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:5px;color:#a1a1aa;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#818cf8;box-shadow:0 0 8px #818cf8;\"><\u002Fspan>expert<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:5px;color:#a1a1aa;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#6366f1;\"><\u002Fspan>proficient<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:5px;color:#a1a1aa;\"><span style=\"width:8px;height:8px;border-radius:50%;border:1px dashed #818cf8;\"><\u002Fspan>learning<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:5px;color:#a1a1aa;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#3f3f46;\"><\u002Fspan>locked<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- RIGHT RAIL -->\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n\n        <!-- quest log -->\n        <div style=\"background:#131316;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:15px 16px;display:flex;flex-direction:column;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;\">\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <span style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;color:#6366f1;\">QUEST LOG<\u002Fspan>\n              <span style=\"font-family:'Geist Mono',monospace;font-size:10px;color:#818cf8;background:rgba(99,102,241,.12);padding:2px 7px;border-radius:20px;\">{{ questsDone }}/{{ questsTotal }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'Geist Mono',monospace;font-size:9.5px;color:#71717a;\">6h 12m<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"dq-scroll\" style=\"display:flex;flex-direction:column;gap:1px;max-height:158px;overflow-y:auto;overflow-x:hidden;padding-right:3px;\">\n            <sc-for list=\"{{ quests }}\" as=\"q\" hint-placeholder-count=\"6\">\n              <div class=\"dq-quest\" onclick=\"{{ q.toggle }}\" style=\"display:flex;align-items:center;gap:10px;padding:6px 7px;border-radius:8px;cursor:pointer;transition:background .12s;\">\n                <div style=\"width:18px;height:18px;flex:none;transform:rotate(45deg);border-radius:4px;border:1.5px solid {{ q.boxBorder }};background:{{ q.boxBg }};display:flex;align-items:center;justify-content:center;transition:.15s;\">\n                  <span style=\"font-size:9px;color:#fff;font-weight:700;transform:rotate(-45deg);\">{{ q.check }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"flex:1;min-width:0;font-size:12px;font-weight:500;color:{{ q.titleColor }};text-decoration:{{ q.strike }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ q.title }}<\u002Fspan>\n                <span style=\"font-family:'Geist Mono',monospace;font-size:10px;color:{{ q.xpColor }};flex:none;\">+{{ q.xp }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- streak (small) -->\n        <div style=\"background:linear-gradient(135deg,rgba(249,115,22,.10),#131316 60%);border:1px solid rgba(249,115,22,.22);border-radius:14px;padding:14px 16px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;\">\n            <div style=\"display:flex;align-items:center;gap:9px;\">\n              <span style=\"font-size:20px;line-height:1;filter:drop-shadow(0 0 8px rgba(249,115,22,.6));\">🔥<\u002Fspan>\n              <div>\n                <div style=\"font-size:16px;font-weight:700;line-height:1;\">12 <span style=\"font-size:11px;font-weight:500;color:#a1a1aa;\">day streak<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:10px;color:#fb923c;margin-top:2px;\">Longest: 21 days<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:4px;\">\n              <sc-for list=\"{{ week }}\" as=\"d\" hint-placeholder-count=\"7\">\n                <div style=\"width:15px;height:15px;border-radius:5px;background:{{ d.bg }};border:1px solid {{ d.border }};display:flex;align-items:center;justify-content:center;font-size:8px;\">{{ d.mark }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- attributes (RPG character sheet) -->\n        <div style=\"background:#131316;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:15px 16px;\">\n          <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;color:#6366f1;margin-bottom:12px;\">ATTRIBUTES<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:11px;\">\n            <sc-for list=\"{{ attributes }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;\">\n                  <span style=\"font-size:11.5px;color:#d4d4d8;\">{{ a.name }}<\u002Fspan>\n                  <span style=\"font-family:'Geist Mono',monospace;font-size:10.5px;color:#818cf8;\">{{ a.value }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:6px;border-radius:20px;background:#27272a;overflow:hidden;\">\n                  <div style=\"height:100%;width:{{ a.pct }};border-radius:20px;background:linear-gradient(90deg,#4f46e5,#818cf8);\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== ACHIEVEMENTS CAROUSEL ===== -->\n    <div>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;\">\n        <div style=\"display:flex;align-items:center;gap:9px;\">\n          <span style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;color:#6366f1;\">ACHIEVEMENTS<\u002Fspan>\n          <span style=\"font-size:12px;color:#71717a;white-space:nowrap;\">9 earned<\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"#\" style=\"font-size:12px;color:#818cf8;text-decoration:none;\">View all →<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"dq-carousel\" style=\"position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);\">\n        <div class=\"dq-track\" style=\"display:flex;gap:16px;width:max-content;animation:dq-marquee 32s linear infinite;\">\n          <sc-for list=\"{{ carousel }}\" as=\"a\" hint-placeholder-count=\"8\">\n            <div style=\"flex:none;width:290px;display:flex;align-items:center;gap:15px;background:{{ a.bg }};border:1px solid {{ a.border }};border-radius:15px;padding:16px 18px;opacity:{{ a.opacity }};\">\n              <div style=\"width:54px;height:54px;flex:none;border-radius:14px;background:{{ a.iconBg }};display:flex;align-items:center;justify-content:center;font-size:26px;{{ a.glow }}\">{{ a.icon }}<\u002Fdiv>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:15px;font-weight:600;color:{{ a.titleColor }};line-height:1.2;\">{{ a.title }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#71717a;margin-top:3px;\">{{ a.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    quests: [\n      { title: \"Solve 1 LeetCode problem\", xp: 50, done: true },\n      { title: \"Read a system design article\", xp: 30, done: true },\n      { title: \"Push a commit to your project\", xp: 40, done: false },\n      { title: \"Apply to 2 jobs\", xp: 30, done: false },\n      { title: \"Review a pull request\", xp: 25, done: false },\n      { title: \"Write unit tests for a module\", xp: 35, done: false },\n    ],\n  };\n\n  toggle(i) {\n    this.setState((s) => ({\n      quests: s.quests.map((q, idx) => idx === i ? { ...q, done: !q.done } : q),\n    }));\n  }\n\n  renderVals() {\n    // ---- quests ----\n    const quests = this.state.quests.map((q, i) => ({\n      title: q.title, xp: q.xp,\n      toggle: () => this.toggle(i),\n      check: q.done ? \"✓\" : \"\",\n      boxBg: q.done ? \"#6366f1\" : \"transparent\",\n      boxBorder: q.done ? \"#6366f1\" : \"#3f3f46\",\n      titleColor: q.done ? \"#71717a\" : \"#e4e4e7\",\n      strike: q.done ? \"line-through\" : \"none\",\n      xpColor: q.done ? \"#4b5563\" : \"#818cf8\",\n    }));\n    const questsDone = this.state.quests.filter((q) => q.done).length;\n\n    // ---- streak week ----\n    const week = [\n      { on: true }, { on: true }, { on: true }, { on: true }, { on: true },\n      { on: false, today: true }, { on: false },\n    ].map((d) => ({\n      mark: d.on ? \"🔥\" : \"\",\n      bg: d.on ? \"rgba(249,115,22,.16)\" : (d.today ? \"rgba(99,102,241,.14)\" : \"rgba(255,255,255,.03)\"),\n      border: d.on ? \"rgba(249,115,22,.4)\" : (d.today ? \"rgba(99,102,241,.5)\" : \"rgba(255,255,255,.06)\"),\n    }));\n\n    // ---- roadmap stages ----\n    const S = (name, icon, xp, status) => ({ name, icon, xp, status });\n    const rawStages = [\n      S(\"Foundations\", \"✓\", \"+150\", \"done\"),\n      S(\"APIs\", \"✓\", \"+180\", \"done\"),\n      S(\"Databases\", \"✓\", \"+180\", \"done\"),\n      S(\"System Design\", \"▶\", \"+200\", \"active\"),\n      S(\"Scaling\", \"🔒\", \"480 XP\", \"locked\"),\n      S(\"Distributed\", \"🏆\", \"BOSS\", \"boss\"),\n    ];\n    const stages = rawStages.map((s, i) => {\n      const last = i === rawStages.length - 1;\n      let bg, border, glow = \"\", anim = \"\", labelColor, xpColor;\n      if (s.status === \"done\") {\n        bg = \"rgba(99,102,241,.18)\"; border = \"1px solid #6366f1\";\n        glow = \"box-shadow:0 0 10px rgba(99,102,241,.4);\";\n        labelColor = \"#a1a1aa\"; xpColor = \"#6366f1\";\n      } else if (s.status === \"active\") {\n        bg = \"rgba(129,140,248,.18)\"; border = \"1.5px solid #818cf8\";\n        anim = \"animation:dq-pulse 2.2s infinite;\";\n        labelColor = \"#fafafa\"; xpColor = \"#818cf8\";\n      } else if (s.status === \"boss\") {\n        bg = \"rgba(249,115,22,.12)\"; border = \"1.5px dashed rgba(249,115,22,.5)\";\n        labelColor = \"#71717a\"; xpColor = \"#a1a1aa\";\n      } else {\n        bg = \"#1c1c20\"; border = \"1px solid #2a2a2e\";\n        labelColor = \"#52525b\"; xpColor = \"#52525b\";\n      }\n      // connector color reflects progress up to the next node\n      const nextDone = !last && (rawStages[i].status === \"done\");\n      const conn = nextDone ? \"#6366f1\"\n        : (rawStages[i].status === \"active\" ? \"linear-gradient(90deg,#818cf8,#3f3f46)\" : \"#27272a\");\n      return {\n        name: s.name, icon: s.icon, xp: s.xp,\n        colW: \"62px\", bg, border, glow, anim, labelColor, xpColor,\n        conn, connDisplay: last ? \"none\" : \"block\",\n      };\n    });\n\n    // ---- attributes ----\n    const attributes = [\n      { name: \"Problem Solving\", value: 82 },\n      { name: \"System Design\", value: 61 },\n      { name: \"Code Quality\", value: 74 },\n      { name: \"Communication\", value: 68 },\n    ].map((a) => ({ name: a.name, value: a.value, pct: a.value + \"%\" }));\n\n    // ---- skill tree branches ----\n    const mastery = {\n      expert:     { bg: \"rgba(99,102,241,.14)\", border: \"1px solid #6366f1\", opacity: \"1\", dotStyle: \"width:7px;height:7px;border-radius:50%;background:#818cf8;box-shadow:0 0 8px #818cf8;flex:none;\", lock: \"\" },\n      proficient: { bg: \"rgba(99,102,241,.14)\", border: \"1px solid #6366f1\", opacity: \"1\", dotStyle: \"width:7px;height:7px;border-radius:50%;background:#6366f1;flex:none;\", lock: \"\" },\n      learning:   { bg: \"rgba(129,140,248,.06)\", border: \"1px dashed rgba(129,140,248,.4)\", opacity: \"1\", dotStyle: \"width:7px;height:7px;border-radius:50%;border:1px dashed #818cf8;flex:none;\", lock: \"\" },\n      locked:     { bg: \"#1c1c20\", border: \"1px solid #2a2a2e\", opacity: \".55\", dotStyle: \"font-size:11px;flex:none;\", lock: \"🔒\" },\n    };\n    const child = (icon, name, m) => ({ icon, name, ...mastery[m] });\n    const branches = [\n      { name: \"Python\", icon: \"🐍\", root: \"expert\",\n        children: [child(\"⚗️\",\"Flask\",\"proficient\"), child(\"🎸\",\"Django\",\"learning\")] },\n      { name: \"JavaScript\", icon: \"🟨\", root: \"proficient\",\n        children: [child(\"⚛️\",\"React\",\"proficient\"), child(\"🟢\",\"Node.js\",\"learning\")] },\n      { name: \"SQL\", icon: \"🗄️\", root: \"proficient\",\n        children: [child(\"🐘\",\"Postgres\",\"proficient\"), child(\"🧊\",\"Redis\",\"locked\")] },\n    ].map((b) => ({\n      name: b.name, icon: b.icon, children: b.children,\n      rootBg: b.root === \"expert\" ? \"rgba(99,102,241,.18)\" : \"rgba(99,102,241,.14)\",\n      rootBorder: b.root === \"expert\" ? \"1.5px solid #818cf8\" : \"1px solid #6366f1\",\n      rootGlow: b.root === \"expert\" ? \"box-shadow:0 0 14px rgba(129,140,248,.5);\" : \"\",\n    }));\n\n    // ---- achievements ----\n    const earned = (icon, title, sub, iconBg) => ({\n      icon, title, sub, iconBg,\n      bg: \"rgba(99,102,241,.06)\", border: \"rgba(99,102,241,.22)\",\n      titleColor: \"#e4e4e7\", opacity: \"1\",\n      glow: \"box-shadow:0 0 14px rgba(99,102,241,.3);\",\n    });\n    const locked = (title) => ({\n      icon: \"🔒\", title, sub: \"Locked\", iconBg: \"rgba(255,255,255,.04)\",\n      bg: \"rgba(255,255,255,.015)\", border: \"rgba(255,255,255,.05)\",\n      titleColor: \"#52525b\", opacity: \".55\", glow: \"\",\n    });\n    const achievements = [\n      earned(\"🚀\", \"First Deploy\", \"Jun 28\", \"rgba(99,102,241,.2)\"),\n      earned(\"🔥\", \"7-Day Streak\", \"Jun 25\", \"rgba(249,115,22,.18)\"),\n      earned(\"🧩\", \"50 Problems\", \"Jun 20\", \"rgba(129,140,248,.2)\"),\n      earned(\"⚡\", \"Speed Runner\", \"Jun 14\", \"rgba(99,102,241,.2)\"),\n      earned(\"🌿\", \"Merged 10 PRs\", \"Jun 09\", \"rgba(99,102,241,.2)\"),\n      earned(\"📦\", \"First Package\", \"Jun 02\", \"rgba(129,140,248,.2)\"),\n      locked(\"Interview Ace\"),\n      locked(\"Level 10\"),\n    ];\n    const carousel = achievements.concat(achievements);\n\n    return { quests, questsDone, questsTotal: this.state.quests.length, week, stages, attributes, branches, carousel };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
